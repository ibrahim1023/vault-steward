name: Release

on:
  push:
    tags: ["0.*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run eval:smoke
      - run: npm run security:check
      - run: npm run package:plugin
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/vault-steward/main.js
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/vault-steward/styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/vault-steward/main.js \
            dist/vault-steward/manifest.json \
            dist/vault-steward/styles.css \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
